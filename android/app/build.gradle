plugins { id 'com.android.application' }

def signingReady = System.getenv('HIROSHI_KEYSTORE') && System.getenv('HIROSHI_STORE_PASSWORD') && System.getenv('HIROSHI_KEY_PASSWORD')
android {
    namespace 'io.github.erendragneel.hiroshi'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.erendragneel.hiroshi'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.2.2'
    }
    signingConfigs {
        if (signingReady) {
            upload {
                storeFile file(System.getenv('HIROSHI_KEYSTORE'))
                storePassword System.getenv('HIROSHI_STORE_PASSWORD')
                keyAlias System.getenv('HIROSHI_KEY_ALIAS') ?: 'hiroshi-sensei'
                keyPassword System.getenv('HIROSHI_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { if (signingReady) signingConfig signingConfigs.upload; minifyEnabled false } }
    buildFeatures { buildConfig true }
    sourceSets { main { assets.srcDirs = ['build/hiroshiAssets'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            // Robolectric 4.16's native loader requires a cache URL without escaped spaces.
            // Windows callers can supply the same Maven cache via its short-path alias.
            if (System.getenv('HIROSHI_TEST_MAVEN_REPO')) {
                systemProperty 'maven.repo.local', System.getenv('HIROSHI_TEST_MAVEN_REPO')
            }
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED',
                '--add-opens=java.base/java.net=ALL-UNNAMED',
                '--add-opens=java.base/java.security=ALL-UNNAMED',
                '--add-opens=java.base/java.text=ALL-UNNAMED',
                '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.activity:activity:1.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

def stageWebAssets = tasks.register('stageWebAssets', Exec) {
    inputs.files(rootProject.fileTree('../public'))
    inputs.files(rootProject.fileTree('web'))
    inputs.file(rootProject.file('scripts/stage-web.mjs'))
    outputs.dir(layout.buildDirectory.dir('hiroshiAssets'))
    workingDir rootProject.projectDir
    commandLine 'node', rootProject.file('scripts/stage-web.mjs').absolutePath
}
tasks.named('preBuild').configure { dependsOn stageWebAssets }

tasks.register('requireSigning') {
    doLast { if (!signingReady) throw new GradleException('Hiroshi release signing is missing. Use scripts/build-release.ps1 or provide HIROSHI_* signing environment variables.') }
}
tasks.configureEach { if (name == 'assembleRelease' || name == 'bundleRelease') dependsOn 'requireSigning' }
