name: Check Hiroshi Android startup

on:
  push:
    branches: [main]
    paths: ['android/**', 'public/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'public/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Use Java 21 for Android 16 startup tests
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Test native startup, lifecycle, auth and inference
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease
